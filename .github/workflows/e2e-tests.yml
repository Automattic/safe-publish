name: End-to-end tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: WordPress ${{ matrix.wordpress-version }} / PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress-version: '6.8'
            php-version: '8.4'
          - wordpress-version: '6.9'
            php-version: '8.5'
          - wordpress-version: '7.0'
            php-version: '8.5'
          - wordpress-version: '7.1'
            php-version: '8.5'
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: npm install -g npm@11

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Configure WordPress environment
        run: |
          printf '{"core":"%s","phpVersion":"%s"}\n' \
            '${{ format('WordPress/WordPress#{0}-branch', matrix.wordpress-version) }}' \
            '${{ matrix.php-version }}' \
            > .wp-env.override.json

      - name: Map host.docker.internal to localhost
        run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts

      - name: Start WordPress environment
        run: npx wp-env start

      - name: Verify WordPress environment
        run: |
          npx wp-env run cli -- php -r '
          $expected = "${{ matrix.php-version }}";
          $actual = PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;
          printf( "PHP %s\n", $actual );
          exit( $actual === $expected ? 0 : 1 );
          '
          npx wp-env run cli -- wp eval '
          global $wp_version;
          $expected = "${{ matrix.wordpress-version }}";
          WP_CLI::log( "WordPress " . $wp_version );
          if ( $wp_version !== $expected
            && ! str_starts_with( $wp_version, $expected . "." ) ) {
            WP_CLI::error( "Expected WordPress " . $expected );
          }
          '

      - name: Build plugin
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: End-to-end tests
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          WP_BASE_URL: http://host.docker.internal:8888
        run: npm run test:e2e

      - name: Upload test artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-wp-${{ matrix.wordpress-version }}-php-${{ matrix.php-version }}
          path: artifacts
          if-no-files-found: ignore

  required:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: ${{ !cancelled() }}
    steps:
      - name: Verify matrix result
        run: test '${{ needs.e2e-tests.result }}' = 'success'
