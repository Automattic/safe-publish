name: Integration tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Start WordPress environment
        id: wp_env
        run: npx wp-env start

      - name: Sync (bidirectional)
        if: ${{ steps.wp_env.outcome == 'success' }}
        run: npm run test:integration:sync-bidirectional

      - name: Sync (import)
        if: ${{ steps.wp_env.outcome == 'success' }}
        run: npm run test:integration:sync-import

      - name: Sync (export)
        if: ${{ steps.wp_env.outcome == 'success' }}
        run: npm run test:integration:sync-export
