name: Integration tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Install Composer dependencies
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Pin wp-env PHP version
        run: echo '{"phpVersion":"${{ matrix.php-version }}"}' > .wp-env.override.json

      - name: Start WordPress environment
        id: wp_env
        run: npx wp-env start

      - name: Sync (bidirectional)
        if: ${{ steps.wp_env.outcome == 'success' }}
        run: npm run test:integration:sync-bidirectional

      - name: Sync (import)
        if: ${{ steps.wp_env.outcome == 'success' }}
        run: npm run test:integration:sync-import

      - name: Sync (export)
        if: ${{ steps.wp_env.outcome == 'success' }}
        run: npm run test:integration:sync-export
