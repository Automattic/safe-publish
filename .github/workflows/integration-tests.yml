name: Integration tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    strategy:
      fail-fast: false
      matrix:
        wordpress-version: ['6.8', '6.9', '7.0']
        php-version: ['8.2', '8.3', '8.4', '8.5']
        exclude:
          - wordpress-version: '6.8'
            php-version: '8.5'
    uses: ./.github/workflows/reusable-integration-tests.yml
    with:
      php-version: ${{ matrix.php-version }}
      wordpress-ref: ${{ format('WordPress/WordPress#{0}-branch', matrix.wordpress-version) }}
      wordpress-version: ${{ matrix.wordpress-version }}

  required:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: integration-tests
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Verify matrix result
        run: test '${{ needs.integration-tests.result }}' = 'success'
