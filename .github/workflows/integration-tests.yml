name: Integration tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    strategy:
      fail-fast: false
      matrix:
        # BEGIN GENERATED COMPATIBILITY MATRIX
        include:
          - wordpress-version: '6.8'
            php-version: '8.2'
          - wordpress-version: '6.8'
            php-version: '8.3'
          - wordpress-version: '6.8'
            php-version: '8.4'
          - wordpress-version: '6.9'
            php-version: '8.2'
          - wordpress-version: '6.9'
            php-version: '8.3'
          - wordpress-version: '6.9'
            php-version: '8.4'
          - wordpress-version: '6.9'
            php-version: '8.5'
          - wordpress-version: '7.0'
            php-version: '8.2'
          - wordpress-version: '7.0'
            php-version: '8.3'
          - wordpress-version: '7.0'
            php-version: '8.4'
          - wordpress-version: '7.0'
            php-version: '8.5'
        # END GENERATED COMPATIBILITY MATRIX
    uses: ./.github/workflows/reusable-integration-tests.yml
    with:
      php-version: ${{ matrix.php-version }}
      wordpress-ref: ${{ format('WordPress/WordPress#{0}-branch', matrix.wordpress-version) }}
      wordpress-version: ${{ matrix.wordpress-version }}

  required:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: integration-tests
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Verify matrix result
        run: test '${{ needs.integration-tests.result }}' = 'success'
